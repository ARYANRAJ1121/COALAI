name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short --cov=src/coalai --cov-report=term-missing

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: coalai
          POSTGRES_PASSWORD: coalai
          POSTGRES_DB: coalai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coalai -d coalai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://coalai:coalai@localhost:5432/coalai_test
      COALAI_TEST_DB_URL: postgresql+asyncpg://coalai:coalai@localhost:5432/coalai_test
      REDIS_URL: redis://localhost:6379/0
      OLLAMA_BASE_URL: http://localhost:11434
      OLLAMA_DEFAULT_MODEL: qwen2.5:0.5b

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run Alembic migrations
        run: DATABASE_URL=$COALAI_TEST_DB_URL alembic upgrade head

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short -m integration
